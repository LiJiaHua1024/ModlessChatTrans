config-version = "3.0.0"
send-translation-independent = false

[message-capture]
minecraft-log-path = "%USERPROFILE%/AppData/Roaming/.minecraft/logs"
log-encoding = "auto"
monitor-mode = "compatible"
filter-server-messages = false
replace-garbled-chars = false
source-language = "English"
target-language = "Simplified Chinese"

[player-translation]
service-type = "llm"
fallback-strategy = "direct"

[player-translation.llm]
provider = "OpenAI"
api-key = ""
api-base = ""
model = "gpt-5.6-luna"
deep-translate = false

# 备用 LLM 模型（可选，仅 service-type="llm" 时生效）。
# 在界面中填写模型代号后才会写入配置；本地端点可以不填 API Key。

[message-presentation]
web-port = 56552

[message-send]
monitor-clipboard = true
source-language = "Simplified Chinese"
target-language = "English"

[settings]
debug = false
interface-language = "zh_CN"
auto-check-update-frequency = "weekly"
include-prerelease = false
last-update-check-time = "1970-01-01T00:00:00"

[glossary]

[blacklist]
user-blacklist = []
message-blacklist = []

[context]
# 上下文翻译策略: "disabled"（禁用上下文翻译）, "fixed"（固定长度）或 "time_based"（基于时间跨度）
strategy = "time_based"
# 最多保留的历史条数（0 = 无限制）
context-length = 10
# 时间跨度阈值（秒），超过则视为新对话（仅 time_based 生效）
context-timeout = 120.0
# 分块截断大小: "disabled"（传统逐条滑动窗口）, "auto"（自动计算为 context-length 的一半）,
#   或正整数字符串（如 "5"）。仅在 context-length > 0 且 strategy != "disabled" 时生效
block-truncation-size = "auto"

[tts]
# 是否启用 Edge TTS 朗读
enabled = false
# 语音选择: "auto" 根据目标语言自动选择，或指定 Edge TTS 语音名（如 zh-CN-XiaoxiaoNeural）
voice = "auto"
# 语速: -100% ~ +100%
speed = "+0%"
# 音调: -50Hz ~ +50Hz
pitch = "+0Hz"
# 最大排队消息数（超出的消息会被丢弃）
max-queue-size = 3
# 是否朗读玩家名称（"某某说：消息内容"）
read-player-name = true
# 不朗读消息的用户列表（净化后的玩家名）
mute-users = []
