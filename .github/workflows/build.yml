name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (optional, format: vx.x.x or x.x.x)'
        required: false
        default: ''
      keep_console:
        description: 'Keep console window'
        type: boolean
        required: false
        default: false
      fast_mode:
        description: 'Fast mode (disables LTO for quicker builds)'
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        powershell -c "irm https://astral.sh/uv/install.ps1 | iex"
        echo "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH
      shell: pwsh

    - name: Install dependencies with uv
      shell: pwsh
      run: |
        $maxRetries = 3
        for ($i = 1; $i -le $maxRetries; $i++) {
          Write-Host "::group::uv sync (attempt $i / $maxRetries)"
          uv sync
          if ($LASTEXITCODE -eq 0) { Write-Host "::endgroup::"; break }
          Write-Host "::endgroup::"
          Write-Host "::warning::uv sync failed (attempt $i / $maxRetries)"
          if ($i -lt $maxRetries) { Start-Sleep -Seconds 10 } else { Write-Host "::error::uv sync failed after $maxRetries attempts"; exit 1 }
        }
        for ($i = 1; $i -le $maxRetries; $i++) {
          Write-Host "::group::uv add nuitka zstandard (attempt $i / $maxRetries)"
          uv add nuitka zstandard
          if ($LASTEXITCODE -eq 0) { Write-Host "::endgroup::"; break }
          Write-Host "::endgroup::"
          Write-Host "::warning::uv add failed (attempt $i / $maxRetries)"
          if ($i -lt $maxRetries) { Start-Sleep -Seconds 10 } else { Write-Host "::error::uv add nuitka zstandard failed after $maxRetries attempts"; exit 1 }
        }
        # Sanity: verify key packages are importable
        uv run python -c "import nuitka; import zstandard; print('nuitka OK, zstandard', zstandard.__version__)"
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::Key packages (nuitka, zstandard) not importable after install"
          exit 1
        }

    - name: Install LLVM/Clang
      shell: pwsh
      run: |
        $maxRetries = 3
        for ($i = 1; $i -le $maxRetries; $i++) {
          Write-Host "::group::Installing LLVM (attempt $i / $maxRetries)"
          choco install llvm --no-progress -y --allow-downgrade
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::endgroup::"
            break
          }
          Write-Host "::endgroup::"
          Write-Host "::warning::choco install llvm failed (attempt $i / $maxRetries)"
          if ($i -lt $maxRetries) {
            Start-Sleep -Seconds 15
          } else {
            Write-Host "::error::Failed to install LLVM/Clang after $maxRetries attempts"
            exit 1
          }
        }
        echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
        # Update PATH for this step so verification works
        $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
        if (-not (Get-Command clang-cl.exe -ErrorAction SilentlyContinue)) {
          Write-Host "::error::clang-cl.exe not found after LLVM install — check chocolatey output above"
          exit 1
        }
        Write-Host "clang-cl version: $(& clang-cl --version)"
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::clang-cl.exe present but returned non-zero exit code"
          exit 1
        }

    - name: Determine LTO mode
      id: determine_lto
      shell: pwsh
      run: |
        # LTO 策略：Tag 触发（Release）始终开启 LTO；
        # 手动触发时，Fast Mode 默认开启 → 关闭 LTO 以加速编译
        # 该步骤在 clcache restore 之前执行，让 cache key 能区分 LTO 模式
        if ("${{ github.event_name }}" -eq "push") {
          echo "lto_mode=yes" >> $env:GITHUB_OUTPUT
          Write-Host "LTO: enabled (release build)"
        } elseif ("${{ github.event.inputs.fast_mode }}" -eq "true") {
          echo "lto_mode=no" >> $env:GITHUB_OUTPUT
          Write-Host "LTO: disabled (fast mode)"
        } else {
          echo "lto_mode=yes" >> $env:GITHUB_OUTPUT
          Write-Host "LTO: enabled (manual, fast mode off)"
        }

    - name: Configure clcache directory
      shell: pwsh
      run: |
        # Nuitka on Windows with --clang uses an INLINE clcache copy (not ccache!).
        # It reads CLCACHE_DIR from the environment. If unset, it defaults to a
        # Nuitka-local path that gets wiped on every ephemeral runner.
        # By setting CLCACHE_DIR here, Nuitka will use our persistent directory.
        $clcacheDir = "${{ github.workspace }}\.clcache"
        New-Item -ItemType Directory -Force -Path $clcacheDir | Out-Null
        echo "CLCACHE_DIR=$clcacheDir" >> $env:GITHUB_ENV
        # Also export for this step's shell (defensive)
        $env:CLCACHE_DIR = $clcacheDir
        Write-Host "clcache directory: $clcacheDir"

    - name: Restore clcache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.clcache
        # LTO=yes 与 LTO=no 的编译产物不兼容，key 必须区分 LTO 模式；
        # GitHub Actions 缓存 key 不可覆盖更新，所以 key 中加入 commit SHA，
        # 每次提交都会得到全新 key（新缓存一定能保存），
        # 再靠 restore-keys 前缀回退到最近一次同 LTO 模式的缓存。
        # clcache 本身会做内容哈希，旧条目即使被恢复也会自动 miss，无副作用。
        # key 中加入分支名（ref_name）按分支隔离：lite/canary 等分支各自拥有
        # 独立的缓存条目，restore 只回退到本分支的缓存，互不读取、互不挤占。
        key: clcache-windows-clang-py3.12-lto-${{ steps.determine_lto.outputs.lto_mode }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          clcache-windows-clang-py3.12-lto-${{ steps.determine_lto.outputs.lto_mode }}-${{ github.ref_name }}-

    - name: Restore Nuitka download cache
      uses: actions/cache@v5
      with:
        path: |
          C:\Users\runneradmin\AppData\Local\Nuitka\Nuitka\Cache\downloads
        # 同样按分支隔离（key 中加入 ref_name），lite/canary 各自独立缓存。
        key: nuitka-downloads-windows-clang-${{ github.ref_name }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          nuitka-downloads-windows-clang-${{ github.ref_name }}-

    - name: Determine version and generate build info
      id: determine_version
      shell: pwsh
      run: |
        # ═══ Edition（变体）判定 ═══
        # standard / lite / nano 三种变体，识别优先级：
        #   1. 版本号后缀（tag 名或手动输入的 -lite/-nano）
        #   2. 分支名（lite / nano 分支）
        #   3. 默认 standard
        # Windows 版本号第 4 位映射：0=standard, 1=lite, 2=nano
        $edition = "standard"
        $editionNum = 0

        function Set-Edition {
          param([string]$Name)
          switch ($Name) {
            "lite" { $script:edition = "lite"; $script:editionNum = 1 }
            "nano" { $script:edition = "nano"; $script:editionNum = 2 }
            default { $script:edition = "standard"; $script:editionNum = 0 }
          }
        }

        # 从 pyproject.toml 读取基础版本号（用于文件命名）
        $baseVersion = (Select-String -Path "pyproject.toml" -Pattern '^version\s*=\s*"(.+)"' | ForEach-Object { $_.Matches.Groups[1].Value })
        $commitSha = "${{ github.sha }}".Substring(0, 8)
        $branchName = "${{ github.ref_name }}"

        # 分支名提供 edition 默认值（可被版本号后缀覆盖）
        if ($branchName -match "^(lite|nano)$") { Set-Edition $Matches[1] }

        # ═══ 解析触发来源，得到正式版本号（如有）═══
        $semverBase = $null
        $isFormal = $false

        if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            # ═══ Tag 触发：v3.3.0 / v3.3.0-lite / v3.3.0-nano ═══
            $tagVersion = $branchName -replace "^v", ""
            if ($tagVersion -match "^(\d+\.\d+\.\d+)(?:-(lite|nano))?$") {
                $semverBase = $Matches[1]
                if ($Matches[2]) { Set-Edition $Matches[2] }
                $isFormal = $true
            }
        }
        elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $inputVersion = "${{ github.event.inputs.version }}"
            # 手动输入带 -lite/-nano 后缀的合法版本号同样视为正式版本
            if (-not [string]::IsNullOrWhiteSpace($inputVersion) -and
                ($inputVersion -replace "^v", "") -match "^(\d+\.\d+\.\d+)(?:-(lite|nano))?$") {
                $semverBase = $Matches[1]
                if ($Matches[2]) { Set-Edition $Matches[2] }
                $isFormal = $true
            }
        }

        # ═══ 依据是否为正式版本生成各字段 ═══
        $editionSuffix = ""
        if ($edition -ne "standard") { $editionSuffix = "-$edition" }

        if ($isFormal) {
            # ═══ 正式版本 ═══
            # Nuitka 的 --file-version/--product-version 只接受纯数字（≤4 段），
            # edition 由第 4 位编码（0=standard, 1=lite, 2=nano）
            $fileVersion = "$semverBase.$editionNum"
            $productVersion = "$semverBase.$editionNum"
            $outputFileName = "ModlessChatTrans_v$semverBase$editionSuffix"
            $buildChannel = "stable"
            $tempdirVersion = $semverBase
        }
        else {
            # ═══ 非正式版本（CI build）═══
            $fileVersion = "0.0.0.0"
            $productVersion = "0.0.0.0"
            # 非正式版本用 commit hash 作为缓存目录版本，避免缓存污染
            $tempdirVersion = $commitSha
            $safeBranch = $branchName -replace "[/\\]", "-"

            if ($branchName -match "^canary-exp") {
                $buildChannel = "canary-exp"
                $outputFileName = "ModlessChatTrans_${safeBranch}_${commitSha}"
            }
            elseif ($branchName -match "^canary") {
                $buildChannel = "canary"
                $outputFileName = "ModlessChatTrans_${safeBranch}_${commitSha}"
            }
            elseif ($branchName -eq "main") {
                # main 分支不带分支名
                $buildChannel = "main"
                $outputFileName = "ModlessChatTrans_${commitSha}"
            }
            else {
                # lite / nano 等特化分支：带上分支名
                $buildChannel = $safeBranch
                $outputFileName = "ModlessChatTrans_${safeBranch}_${commitSha}"
            }
        }

        # ═══ onefile-tempdir-spec ═══
        # {CACHE_DIR}/ModlessChatTrans[_lite/_nano]/{VERSION}
        # standard 无后缀；lite/nano 加 _lite/_nano；{VERSION} 为合法版本号或 commit hash
        $editionDirSuffix = ""
        if ($edition -ne "standard") { $editionDirSuffix = "_$edition" }
        $onefileTempdirSpec = "{CACHE_DIR}/ModlessChatTrans$editionDirSuffix/$tempdirVersion"

        # 生成 _build_info.py（仅包含 CI 构建元数据）
        @"
        BUILD_CHANNEL = "$buildChannel"
        EDITION = "$edition"
        BRANCH = "$branchName"
        COMMIT_SHA = "$commitSha"
        "@ -split "`n" | ForEach-Object { $_.TrimStart() } | Set-Content -Path "src/modless_chat_trans/_build_info.py" -Encoding utf8

        echo "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
        echo "product_version=$productVersion" >> $env:GITHUB_OUTPUT
        echo "output_file_name=$outputFileName" >> $env:GITHUB_OUTPUT
        echo "edition=$edition" >> $env:GITHUB_OUTPUT
        echo "onefile_tempdir_spec=$onefileTempdirSpec" >> $env:GITHUB_OUTPUT

        Write-Host "Build info:"
        Write-Host "  Base version:  $baseVersion"
        Write-Host "  Build channel: $buildChannel"
        Write-Host "  Edition:       $edition (windows 4th digit: $editionNum)"
        Write-Host "  Branch:        $branchName"
        Write-Host "  Commit:        $commitSha"
        Write-Host "  File version:  $fileVersion"
        Write-Host "  Tempdir spec:  $onefileTempdirSpec"
        Write-Host "  Output file:   $outputFileName"

    - name: Build with Nuitka
      shell: pwsh
      run: |
        # Ensure CLCACHE_DIR is set in this shell (already in GITHUB_ENV, but defensive)
        $env:CLCACHE_DIR = "${{ github.workspace }}\.clcache"
        New-Item -ItemType Directory -Force -Path $env:CLCACHE_DIR -ErrorAction SilentlyContinue | Out-Null

        $fileVersion = "${{ steps.determine_version.outputs.file_version }}"
        $productVersion = "${{ steps.determine_version.outputs.product_version }}"
        $tempdirSpec = "${{ steps.determine_version.outputs.onefile_tempdir_spec }}"
        $keepConsole = "${{ github.event.inputs.keep_console }}"

        $commonArgs = @(
          '--onefile'
          '--onefile-cache-mode=cached'
          # pywebview 6.2.1 新增 platforms/win32.py，但 Nuitka 4.1.3 的
          # PywebViewPlugin 硬编码白名单未包含它，会主动排除导致运行时
          # ImportError（详见 Nuitka PR #3979，修复未随 4.1.3 发布）。
          # 禁用该插件并显式包含 win32 作为 workaround；Nuitka 发布
          # 含修复的版本后即可移除这两行。
          '--disable-plugin=pywebview'
          '--include-module=webview.platforms.win32'
          "--onefile-tempdir-spec=$tempdirSpec"
          '--clang'
          '--noinclude-pytest-mode=nofollow'
          # 排除运行时用不到的 stdlib / 打包工具链模块以减小产物体积。
          # 注意：email / unittest / pydoc 不能排除——werkzeug、urllib3、
          # pyparsing 等运行时依赖链顶层 import 它们，排除会导致启动闪退。
          '--noinclude-setuptools-mode=nofollow'
          '--nofollow-import-to=pkg_resources'
          '--nofollow-import-to=distutils'
          '--nofollow-import-to=tkinter'
          '--windows-icon-from-ico=src/icon.ico'
          '--onefile-windows-splash-screen-image=src/splash.png'
          '--include-package=urllib3'
          '--include-package-data=certifi'
          '--include-data-dir=src/locales=locales'
          '--include-data-dir=src/templates=templates'
          '--include-data-dir=src/static=static'
          '--include-data-dir=src/modless_chat_trans/webui/templates=modless_chat_trans/webui/templates'
          '--include-data-dir=src/modless_chat_trans/webui/static=modless_chat_trans/webui/static'
          '--include-data-file=src/icon.ico=icon.ico'
          '--include-data-file=src/modless-chat-trans.default.json=modless-chat-trans.default.json'
          '--include-data-file=src/modless-chat-trans.default.toml=modless-chat-trans.default.toml'
          '--output-filename=ModlessChatTrans'
          '--file-description=ModlessChatTrans'
          '--product-name=ModlessChatTrans'
          '--copyright=Copyright © 2024-2026 LiJiaHua1024'
          '--assume-yes-for-downloads'
          "--file-version=$fileVersion"
          "--product-version=$productVersion"
        )

        # 只在非手动触发或手动触发时keep_console为false时禁用控制台
        if ("${{ github.event_name }}" -ne "workflow_dispatch" -or $keepConsole -ne "true") {
          $commonArgs += '--windows-console-mode=disable'
        }

        # LTO 模式统一由 determine_lto 步骤判定（与 clcache key 保持一致）
        $ltoMode = "${{ steps.determine_lto.outputs.lto_mode }}"
        $commonArgs += "--lto=$ltoMode"
        Write-Host "LTO: $ltoMode"

        # ---- Nuitka build with retry ----
        # Nuitka may fail spuriously when downloading toolchain / dependency
        # packages over flaky networks. Retry a few times with back-off.
        $maxBuildRetries = 3
        $buildSucceeded = $false
        for ($i = 1; $i -le $maxBuildRetries; $i++) {
          Write-Host "::group::Nuitka build (attempt $i / $maxBuildRetries)"
          uv run nuitka @commonArgs src/main.py
          if ($LASTEXITCODE -eq 0) {
            $buildSucceeded = $true
            Write-Host "::endgroup::"
            break
          }
          Write-Host "::endgroup::"
          Write-Host "::warning::Nuitka build failed (attempt $i / $maxBuildRetries, exit code $LASTEXITCODE)"
          if ($i -lt $maxBuildRetries) {
            $delay = 30 * [Math]::Pow(2, $i - 1)   # 30, 60, 120 s
            Write-Host "Retrying in $delay seconds..."
            Start-Sleep -Seconds $delay
          }
        }
        if (-not $buildSucceeded) {
          Write-Host "::error::Nuitka build failed after $maxBuildRetries attempts — check logs above for the underlying error"
          exit 1
        }

        # ---- Post-build sanity checks ----
        if (-not (Test-Path "ModlessChatTrans.exe")) {
          Write-Host "::error::ModlessChatTrans.exe not found after successful Nuitka exit — build may have silently failed"
          exit 1
        }
        $exeSize = (Get-Item "ModlessChatTrans.exe").Length
        Write-Host "ModlessChatTrans.exe size: $([math]::Round($exeSize / 1MB, 1)) MB"
        if ($exeSize -lt 1048576) {
          Write-Host "::error::ModlessChatTrans.exe is smaller than 1 MB ($exeSize bytes) — likely a corrupted / stub binary"
          exit 1
        }

        # ---- clcache statistics ----
        # Nuitka already prints clcache hit/miss summary in its build output.
        # Here we show the cache directory size for verification.
        Write-Host "::group::clcache stats"
        $clcacheSize = (Get-ChildItem -Path $env:CLCACHE_DIR -Recurse -ErrorAction SilentlyContinue |
            Measure-Object -Property Length -Sum).Sum
        if ($clcacheSize) {
          Write-Host "clcache directory size: $([math]::Round($clcacheSize / 1MB, 1)) MB"
        } else {
          Write-Host "clcache directory is empty (first run or cache was not restored)"
        }
        Write-Host "::endgroup::"

    - name: Rename executable
      shell: pwsh
      run: |
        $outputName = "${{ steps.determine_version.outputs.output_file_name }}"
        if (-not (Test-Path "ModlessChatTrans.exe")) {
          Write-Host "::error::ModlessChatTrans.exe missing before rename — previous steps may have reported false success"
          exit 1
        }
        ren ModlessChatTrans.exe "${outputName}.exe"
        if (-not (Test-Path "${outputName}.exe")) {
          Write-Host "::error::Rename to ${outputName}.exe failed"
          exit 1
        }
        Write-Host "Artifact ready: ${outputName}.exe ($([math]::Round((Get-Item "${outputName}.exe").Length / 1MB, 1)) MB)"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ModlessChatTrans
        path: |
          ./${{ steps.determine_version.outputs.output_file_name }}.exe
        archive: false