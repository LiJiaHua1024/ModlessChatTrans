[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ModlessChatTrans"
version = "3.2.1"
description = "A tool that provides real-time chat translation for Minecraft players without requiring any mods."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [
  { name="LiJiaHua1024", email="minecraft_benli@163.com" },
]
dependencies = [
    "requests>=2.25.0",
    "Flask>=3.0.0,<3.2.0",
    "pyperclip>=1.8.0,<2.0.0",
    "translators~=6.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "loguru~=0.7.3",
    "packaging~=25.0",
    "urllib3>=2.6.3",
    "markdown>=3.8.2",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "tomli-w>=1.2.0",
    "netifaces>=0.11.0",
    "diskcache>=5.6.3",
    "pywebview>=6.0",
    "lazy-loader>=0.4",
    "edge-tts>=7.2.8",
    "miniaudio>=1.71",
]

# 可选依赖：Google Vertex AI 需要 google-auth（推荐）或 cryptography 来签发
# 服务账号访问令牌。两者都不安装时，Vertex AI 提供商给出明确错误（与
# 旧版 litellm 依赖 google-auth 的行为一致），其余 22 个提供商不受影响。
[project.optional-dependencies]
vertex = [
    "cryptography>=42.0.0",
]

# 如需滚动和高度限制的下拉菜单，请按以下步骤操作：
# 1. 下载仓库 https://github.com/Akascape/CTkScrollableDropdown
# 2. 解压后进入仓库目录
# 3. 将其中的 CTkScrollableDropdown 子文件夹复制到src/目录

[project.scripts]
modless-chat-trans = "main:main"

[dependency-groups]
tools = [
    "babel==2.17.0",
]
